<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO SHOOTER</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d1a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas#game {
      display: block;
      cursor: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
// ============================================================
// 1. PALETTE & CONSTANTS
// ============================================================
const P = {
  BG:           '#0d0d1a',
  GRID:         '#111128',
  PLAYER_BODY:  '#a8dadc',
  PLAYER_DARK:  '#6ab0b3',
  PLAYER_GUN:   '#e94560',
  PLAYER_LEGS:  '#16213e',
  BULLET_P:     '#ffe066',
  BULLET_E:     '#ff6b6b',
  ENEMY_TANK:   '#c97d4e',
  ENEMY_TANK_D: '#7a4d30',
  ENEMY_FAST:   '#8855ff',
  ENEMY_FAST_D: '#552299',
  ENEMY_RANGED: '#55cc77',
  ENEMY_RANGED_D:'#337744',
  WHITE:        '#ffffff',
  UI_TITLE:     '#e94560',
  UI_TEXT:      '#a8dadc',
  UI_DIM:       '#4a6a6d',
  UI_SHADOW:    '#000000',
  HP_HIGH:      '#55cc77',
  HP_MED:       '#ffe066',
  HP_LOW:       '#e94560',
  HP_BG:        '#1a1a2e',
  OVERLAY:      'rgba(10,10,22,0.82)',
  MUZZLE:       '#ffe066',
  PART1:        '#e94560',
  PART2:        '#ffe066',
  PART3:        '#a8dadc',
};

const CW = 800, CH = 600;
const TILE = 32;
const PLAYER_SPEED   = 185;
const PLAYER_RADIUS  = 13;
const PLAYER_MAX_HP  = 100;
const FIRE_RATE      = 0.16;
const BULLET_SPEED_P = 500;
const BULLET_SPEED_E = 230;
const BULLET_RADIUS_P = 4;
const BULLET_RADIUS_E = 5;
const MELEE_DPS      = 18;

// ============================================================
// 2. GLOBALS
// ============================================================
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

let gameState = 'MENU';
let gameTime  = 0;
let score     = 0;
let currentLevel = 0;
let currentWave  = 0;

let player, enemies, playerBullets, enemyBullets, particles;
let spawnQueue = [], spawnTimer = 0;
let waveActive = false;
let tookDamageThisWave = false;
let levelCompleteTimer = 0;
let waveBannerTimer = 0;
let waveCleared = false;

let shake = { x:0, y:0, timer:0, mag:0 };
let muzzleFlash = { x:0, y:0, life:0, maxLife:0.08 };

// ============================================================
// 3. INPUT HANDLER
// ============================================================
const keys  = {};
const mouse = { x: CW/2, y: CH/2, down: false, clicked: false };

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (CW / r.width);
  mouse.y = (e.clientY - r.top)  * (CH / r.height);
});
canvas.addEventListener('mousedown', () => { mouse.down = true; mouse.clicked = true; });
canvas.addEventListener('mouseup',   () => { mouse.down = false; });

function isKeyDown(...ks) { return ks.some(k => keys[k]); }

// ============================================================
// 4. UTILITIES
// ============================================================
function dist2(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx*dx + dy*dy;
}
function dist(a, b) { return Math.sqrt(dist2(a, b)); }
function overlap(a, b) { return dist(a, b) < a.radius + b.radius; }

function drawText(text, x, y, size, color, align = 'left', bold = false) {
  ctx.save();
  ctx.font = `${bold ? 'bold ' : ''}${size}px monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.fillStyle = P.UI_SHADOW;
  ctx.fillText(text, x + 2, y + 2);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawButton(label, cx, cy, w, h, hovered) {
  const x = cx - w/2, y = cy - h/2;
  ctx.fillStyle = hovered ? '#c73652' : P.UI_TITLE;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#ff8098';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x+1, y+1, w-2, h-2);
  drawText(label, cx, cy - 8, 14, '#fff', 'center', true);
}

function buttonHovered(cx, cy, w, h) {
  return mouse.x >= cx-w/2 && mouse.x <= cx+w/2 &&
         mouse.y >= cy-h/2 && mouse.y <= cy+h/2;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomEdgeSpawn() {
  const edge = Math.floor(Math.random() * 4);
  if (edge === 0) return { x: Math.random()*CW, y: -25 };
  if (edge === 1) return { x: Math.random()*CW, y: CH+25 };
  if (edge === 2) return { x: -25, y: Math.random()*CH };
  return { x: CW+25, y: Math.random()*CH };
}

// ============================================================
// 5. PARTICLES
// ============================================================
class Particle {
  constructor(x, y, color, speed, size, lifetime) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    this.vx = Math.cos(a) * speed;
    this.vy = Math.sin(a) * speed;
    this.color = color;
    this.size = size;
    this.life = 1;
    this.lifetime = lifetime;
  }
  update(dt) {
    this.x  += this.vx * dt;
    this.y  += this.vy * dt;
    this.vx *= 0.92;
    this.vy *= 0.92;
    this.life -= dt / this.lifetime;
  }
  draw() {
    const s = this.size * this.life;
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - s/2, this.y - s/2, s, s);
    ctx.globalAlpha = 1;
  }
  get dead() { return this.life <= 0; }
}

function spawnDeathExplosion(x, y, baseColor, n = 20) {
  const cols = [P.PART1, P.PART2, P.PART3, baseColor, baseColor];
  for (let i = 0; i < n; i++) {
    const spd  = 80 + Math.random() * 250;
    const sz   = 3 + Math.random() * 5;
    const life = 0.4 + Math.random() * 0.5;
    const col  = cols[Math.floor(Math.random() * cols.length)];
    particles.push(new Particle(x, y, col, spd, sz, life));
  }
}

function spawnHitSparks(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    const spd  = 50 + Math.random() * 130;
    const sz   = 2 + Math.random() * 2;
    const col  = Math.random() < 0.5 ? P.PART2 : P.WHITE;
    particles.push(new Particle(x, y, col, spd, sz, 0.25));
  }
}

// ============================================================
// 6. BULLET
// ============================================================
class Bullet {
  constructor(x, y, vx, vy, radius, owner, damage) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.radius = radius;
    this.owner = owner;
    this.damage = damage;
    this.alive = true;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -20 || this.x > CW+20 || this.y < -20 || this.y > CH+20) this.alive = false;
  }
  draw() {
    const r = this.radius;
    if (this.owner === 'player') {
      ctx.fillStyle = '#fff';
      ctx.fillRect(this.x - r - 1, this.y - r - 1, r*2+2, r*2+2);
      ctx.fillStyle = P.BULLET_P;
      ctx.fillRect(this.x - r, this.y - r, r*2, r*2);
    } else {
      ctx.fillStyle = '#7a1111';
      ctx.fillRect(this.x - r - 1, this.y - r - 1, r*2+2, r*2+2);
      ctx.fillStyle = P.BULLET_E;
      ctx.fillRect(this.x - r, this.y - r, r*2, r*2);
    }
  }
}

// ============================================================
// 7. ENEMY BASE + SUBTYPES
// ============================================================
class Enemy {
  constructor(x, y, hp, radius, speed, dmg, score, type) {
    this.x = x; this.y = y;
    this.hp = hp; this.maxHp = hp;
    this.radius = radius;
    this.speed = speed;
    this.damage = dmg;
    this.scoreValue = score;
    this.type = type;
    this.alive = true;
    this.hitFlashTimer = 0;
    this.angle = 0;
  }
  takeDamage(dmg) {
    this.hp -= dmg;
    this.hitFlashTimer = 0.1;
    if (this.hp <= 0) this.die();
  }
  die() {
    this.alive = false;
    spawnDeathExplosion(this.x, this.y, this.baseColor, 22);
    score += this.scoreValue;
  }
  updateBase(dt) {
    this.hitFlashTimer = Math.max(0, this.hitFlashTimer - dt);
  }
  drawHealthBar() {
    if (this.hp >= this.maxHp) return;
    const bw = this.radius * 2 + 6, bh = 4;
    const bx = this.x - bw/2, by = this.y - this.radius - 10;
    ctx.fillStyle = P.HP_BG;
    ctx.fillRect(bx, by, bw, bh);
    const frac = Math.max(0, this.hp / this.maxHp);
    const col = frac > 0.6 ? P.HP_HIGH : frac > 0.3 ? P.HP_MED : P.HP_LOW;
    ctx.fillStyle = col;
    ctx.fillRect(bx, by, bw * frac, bh);
  }
}

class TankEnemy extends Enemy {
  constructor(x, y) {
    super(x, y, 80, 16, 70, MELEE_DPS, 50, 'TANK');
    this.baseColor = P.ENEMY_TANK;
  }
  update(dt, pl) {
    this.updateBase(dt);
    const dx = pl.x - this.x, dy = pl.y - this.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 1;
    this.x += (dx/d) * this.speed * dt;
    this.y += (dy/d) * this.speed * dt;
    this.angle = Math.atan2(dy, dx);
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    const flash = this.hitFlashTimer > 0;
    const body  = flash ? P.WHITE : P.ENEMY_TANK;
    const dark  = flash ? '#ddd'  : P.ENEMY_TANK_D;
    // body square
    ctx.fillStyle = body;
    ctx.fillRect(-13, -13, 26, 26);
    // armor corners
    ctx.fillStyle = dark;
    ctx.fillRect(-15, -15, 7, 7);
    ctx.fillRect( 8, -15, 7, 7);
    ctx.fillRect(-15,  8, 7, 7);
    ctx.fillRect( 8,  8, 7, 7);
    // gun barrel
    ctx.fillStyle = dark;
    ctx.fillRect(10, -3, 10, 6);
    // eyes
    ctx.fillStyle = flash ? '#999' : '#fff';
    ctx.fillRect(-4, -7, 5, 5);
    ctx.fillRect(-4,  2, 5, 5);
    ctx.fillStyle = '#111';
    ctx.fillRect(-2, -5, 2, 2);
    ctx.fillRect(-2,  4, 2, 2);
    ctx.restore();
    this.drawHealthBar();
  }
}

class FastEnemy extends Enemy {
  constructor(x, y) {
    super(x, y, 20, 10, 210, MELEE_DPS * 0.7, 30, 'FAST');
    this.baseColor = P.ENEMY_FAST;
    this.wavePhase = Math.random() * Math.PI * 2;
  }
  update(dt, pl) {
    this.updateBase(dt);
    gameTime; // reference for lateral weave
    const dx = pl.x - this.x, dy = pl.y - this.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 1;
    // lateral weave
    const perp = { x: -dy/d, y: dx/d };
    const wave = Math.sin(gameTime * 4 + this.wavePhase) * 45;
    this.x += ((dx/d) * this.speed + perp.x * wave) * dt;
    this.y += ((dy/d) * this.speed + perp.y * wave) * dt;
    this.angle = Math.atan2(dy, dx);
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle + Math.PI / 4);
    const flash = this.hitFlashTimer > 0;
    // diamond = rotated square
    ctx.fillStyle = flash ? P.WHITE : P.ENEMY_FAST;
    ctx.fillRect(-9, -9, 18, 18);
    ctx.fillStyle = flash ? '#bbb' : P.ENEMY_FAST_D;
    ctx.fillRect(-4, -9, 8, 4);
    // eyes (rotate back)
    ctx.rotate(-Math.PI / 4);
    ctx.fillStyle = flash ? '#999' : '#fff';
    ctx.fillRect(-5, -3, 4, 4);
    ctx.fillRect( 1, -3, 4, 4);
    ctx.fillStyle = '#111';
    ctx.fillRect(-4, -2, 2, 2);
    ctx.fillRect( 2, -2, 2, 2);
    ctx.restore();
    this.drawHealthBar();
  }
}

class RangedEnemy extends Enemy {
  constructor(x, y) {
    super(x, y, 35, 13, 65, 0, 60, 'RANGED');
    this.baseColor = P.ENEMY_RANGED;
    this.fireTimer = 1 + Math.random();
    this.preferredDist = 220;
  }
  update(dt, pl) {
    this.updateBase(dt);
    const dx = pl.x - this.x, dy = pl.y - this.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 1;
    this.angle = Math.atan2(dy, dx);
    const diff = d - this.preferredDist;
    if (Math.abs(diff) > 30) {
      const dir = diff > 0 ? 1 : -1;
      this.x += (dx/d) * this.speed * dir * dt;
      this.y += (dy/d) * this.speed * dir * dt;
    }
    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.fireTimer = 1.8 + Math.random() * 0.5;
      const spd = BULLET_SPEED_E;
      enemyBullets.push(new Bullet(this.x, this.y, (dx/d)*spd, (dy/d)*spd, BULLET_RADIUS_E, 'enemy', 12));
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    const flash = this.hitFlashTimer > 0;
    // octagon via circle
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 - Math.PI/8;
      const r = 12;
      i === 0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.fillStyle = flash ? P.WHITE : P.ENEMY_RANGED;
    ctx.fill();
    // gun barrel pointing at player
    ctx.rotate(this.angle);
    ctx.fillStyle = flash ? '#ccc' : P.ENEMY_RANGED_D;
    ctx.fillRect(8, -2.5, 13, 5);
    ctx.fillRect(-5, -5, 10, 10);
    // antennae
    ctx.fillRect(-3, -16, 4, 7);
    ctx.fillStyle = P.PART2;
    ctx.fillRect(-2, -17, 3, 3);
    ctx.restore();
    this.drawHealthBar();
  }
}

function makeEnemy(type) {
  const pos = randomEdgeSpawn();
  if (type === 'TANK')   return new TankEnemy(pos.x, pos.y);
  if (type === 'FAST')   return new FastEnemy(pos.x, pos.y);
  if (type === 'RANGED') return new RangedEnemy(pos.x, pos.y);
}

// ============================================================
// 8. PLAYER
// ============================================================
class Player {
  constructor() {
    this.x = CW / 2;
    this.y = CH / 2;
    this.hp = PLAYER_MAX_HP;
    this.maxHp = PLAYER_MAX_HP;
    this.radius = PLAYER_RADIUS;
    this.angle = 0;
    this.fireTimer = 0;
    this.alive = true;
    this.invTimer = 0;
    this.walkCycle = 0;
    this.recoilTimer = 0;
    this.moving = false;
  }

  update(dt) {
    // movement
    let dx = 0, dy = 0;
    if (isKeyDown('ArrowLeft',  'a', 'A')) dx -= 1;
    if (isKeyDown('ArrowRight', 'd', 'D')) dx += 1;
    if (isKeyDown('ArrowUp',    'w', 'W')) dy -= 1;
    if (isKeyDown('ArrowDown',  's', 'S')) dy += 1;
    this.moving = dx !== 0 || dy !== 0;
    if (this.moving) {
      const len = Math.sqrt(dx*dx + dy*dy);
      dx /= len; dy /= len;
      this.x += dx * PLAYER_SPEED * dt;
      this.y += dy * PLAYER_SPEED * dt;
    }
    this.x = clamp(this.x, this.radius, CW - this.radius);
    this.y = clamp(this.y, this.radius, CH - this.radius);

    // aim
    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

    // walk animation
    if (this.moving) this.walkCycle += dt * 9;
    else this.walkCycle *= 0.82;

    // fire
    this.fireTimer = Math.max(0, this.fireTimer - dt);
    if (mouse.down && this.fireTimer <= 0) {
      this.fire();
    }

    // timers
    this.recoilTimer = Math.max(0, this.recoilTimer - dt);
    this.invTimer    = Math.max(0, this.invTimer - dt);
  }

  fire() {
    this.fireTimer = FIRE_RATE;
    this.recoilTimer = 0.1;
    const tipDist = 30; // distance from player center to gun muzzle in local +X
    const tx = this.x + Math.cos(this.angle) * tipDist;
    const ty = this.y + Math.sin(this.angle) * tipDist;
    const spd = BULLET_SPEED_P;
    playerBullets.push(new Bullet(tx, ty, Math.cos(this.angle)*spd, Math.sin(this.angle)*spd, BULLET_RADIUS_P, 'player', 25));
    muzzleFlash.x    = tx;
    muzzleFlash.y    = ty;
    muzzleFlash.life = muzzleFlash.maxLife;
  }

  takeDamage(dmg) {
    if (this.invTimer > 0) return;
    this.hp = Math.max(0, this.hp - dmg);
    this.invTimer = 0.3;
    tookDamageThisWave = true;
    shake.timer = 0.18; shake.mag = 5;
    if (this.hp <= 0) this.alive = false;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // --- animation values ---
    // breathe: gentle up/down idle bob (in local Y = perpendicular-to-aim axis)
    const breathe   = Math.sin(gameTime * 2.1) * 0.8;
    // stride: legs alternate forward/backward in X (aim axis)
    const stride1   = Math.sin(this.walkCycle) * 6;        // left leg (+Y side)
    const stride2   = -stride1;                             // right leg (-Y side)
    const bodyBob   = this.moving ? Math.abs(Math.sin(this.walkCycle)) * 1.4 : 0;
    const armSwing  = this.moving ? Math.sin(this.walkCycle + Math.PI) * 5 : 0;
    const recoilOff = 5 * (this.recoilTimer / 0.1);
    const gunLen    = 19 - recoilOff;
    // vertical reference that shifts body with bob + breathe
    const by = breathe - bodyBob;

    // ---- SHADOW ----
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#000';
    ctx.scale(1.05, 0.45);
    ctx.beginPath();
    ctx.arc(1, 34, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ---- BOOTS (drawn first, behind legs) ----
    // left boot (at Y=-11)
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(-3 + stride1, -15, 9, 5);   // sole
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-2 + stride1, -17, 8, 3);   // upper
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect( 4 + stride1, -17, 2, 3);   // toe cap

    // right boot (at Y=+9)
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(-3 + stride2,  9, 9, 5);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-2 + stride2, 11, 8, 3);
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect( 4 + stride2, 11, 2, 3);

    // ---- PANTS / LEGS ----
    ctx.fillStyle = '#1e3a60';
    ctx.fillRect(-6 + stride1 * 0.55, -13, 8, 8);  // left leg
    ctx.fillRect(-6 + stride2 * 0.55,  5,  8, 8);  // right leg
    // knee highlight
    ctx.fillStyle = '#254a78';
    ctx.fillRect(-5 + stride1 * 0.55, -11, 4, 3);
    ctx.fillRect(-5 + stride2 * 0.55,  7,  4, 3);

    // ---- TORSO BASE ----
    ctx.fillStyle = P.PLAYER_BODY;
    ctx.fillRect(-9, -11 + by, 16, 22);

    // ---- TACTICAL VEST ----
    ctx.fillStyle = '#1c3d5e';
    ctx.fillRect(-8, -10 + by, 14, 13);          // vest body
    ctx.fillStyle = '#254f78';
    ctx.fillRect(-7,  -9 + by, 12, 5);           // upper plate
    // plate ridge
    ctx.fillStyle = '#2d5f8a';
    ctx.fillRect(-7,  -9 + by, 12, 1);
    ctx.fillRect(-7,  -5 + by, 12, 1);
    // left chest pocket
    ctx.fillStyle = '#142d45';
    ctx.fillRect(-7,  -7 + by, 5, 5);
    ctx.fillStyle = '#1a3a55';
    ctx.fillRect(-6,  -6 + by, 3, 3);
    // right chest pocket
    ctx.fillStyle = '#142d45';
    ctx.fillRect( 2,  -7 + by, 5, 5);
    ctx.fillStyle = '#1a3a55';
    ctx.fillRect( 3,  -6 + by, 3, 3);
    // lower vest strap
    ctx.fillStyle = '#162f48';
    ctx.fillRect(-8,   1 + by, 14, 3);

    // ---- BELT ----
    ctx.fillStyle = '#2a1a08';
    ctx.fillRect(-9, 3 + by, 16, 3);
    ctx.fillStyle = '#705020';
    ctx.fillRect(-1, 3 + by, 3, 3);              // buckle
    ctx.fillStyle = '#906030';
    ctx.fillRect( 0, 4 + by, 2, 1);              // buckle shine

    // ---- FREE ARM (swings opposite to gun) ----
    // placed at Y=-14 side (local left)
    ctx.fillStyle = P.PLAYER_BODY;
    ctx.fillRect(-5 + armSwing * 0.5, -17 + by, 6, 10); // upper arm
    ctx.fillStyle = '#6ab0b3';
    ctx.fillRect(-5 + armSwing * 0.5, -9  + by, 6, 7);  // forearm
    ctx.fillStyle = '#5a9ea0';
    ctx.fillRect(-4 + armSwing * 0.5, -4  + by, 5, 4);  // glove

    // ---- GUN ARM + GUN ----
    // upper arm (at Y=+12 side, extending forward in +X)
    ctx.fillStyle = P.PLAYER_BODY;
    ctx.fillRect(2,  9 + by, 7, 8);              // upper arm stub
    // wrist / gun hand
    ctx.fillStyle = '#5a9ea0';
    ctx.fillRect(7,  8 + by, 6, 7);

    // gun body (the whole weapon)
    //   grip
    ctx.fillStyle = '#2a2020';
    ctx.fillRect(10,  9 + by, 7, 9);             // grip housing
    ctx.fillStyle = P.PLAYER_GUN;
    ctx.fillRect(11, 10 + by, 5, 7);             // grip color
    ctx.fillStyle = '#c03050';
    ctx.fillRect(12, 11 + by, 2, 5);             // grip texture stripe 1
    ctx.fillRect(14, 11 + by, 2, 5);             // grip texture stripe 2
    //   magazine
    ctx.fillStyle = '#111';
    ctx.fillRect(12, 17 + by, 5, 7);
    ctx.fillStyle = '#222';
    ctx.fillRect(13, 18 + by, 3, 2);             // mag window
    //   main slide / receiver
    ctx.fillStyle = '#2e2e2e';
    ctx.fillRect(9,  5 + by, gunLen, 7);
    ctx.fillStyle = '#3c3c3c';
    ctx.fillRect(11,  4 + by, gunLen - 4, 4);    // slide top
    //   ejection port
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(14,  5 + by, 5, 3);
    //   rail / sight base
    ctx.fillStyle = '#555';
    ctx.fillRect(13,  3 + by, gunLen - 6, 1);
    //   rear sight
    ctx.fillStyle = '#888';
    ctx.fillRect(13,  2 + by, 3, 2);
    ctx.fillStyle = '#000';
    ctx.fillRect(14,  2 + by, 1, 2);
    //   front sight
    ctx.fillStyle = '#888';
    ctx.fillRect(9 + gunLen - 4, 3 + by, 3, 3);
    ctx.fillStyle = P.MUZZLE;
    ctx.fillRect(9 + gunLen - 3, 3 + by, 1, 3);  // front sight dot (gold)
    //   muzzle / barrel tip
    ctx.fillStyle = '#444';
    ctx.fillRect(9 + gunLen, 5 + by, 6, 5);
    ctx.fillStyle = '#222';
    ctx.fillRect(9 + gunLen + 2, 6 + by, 2, 3);  // bore

    // ---- SHOULDER PADS ----
    ctx.fillStyle = '#1c4060';
    ctx.beginPath(); ctx.arc(-1, -14 + by, 6, 0, Math.PI * 2); ctx.fill(); // left
    ctx.beginPath(); ctx.arc(-1,  14 + by, 6, 0, Math.PI * 2); ctx.fill(); // right
    ctx.fillStyle = '#2a5a80';
    ctx.fillRect(-4, -18 + by, 8, 2);            // left pad edge
    ctx.fillRect(-4,  10 + by, 8, 2);            // right pad edge
    // pad rivets
    ctx.fillStyle = '#4a80a0';
    ctx.fillRect(-3, -17 + by, 2, 2);
    ctx.fillRect( 1, -17 + by, 2, 2);
    ctx.fillRect(-3,  11 + by, 2, 2);
    ctx.fillRect( 1,  11 + by, 2, 2);

    // ---- NECK ----
    ctx.fillStyle = '#7abcbe';
    ctx.fillRect(-2, -19 + by, 5, 5);
    ctx.fillStyle = '#60a0a2';
    ctx.fillRect(-1, -19 + by, 3, 2);            // collar detail

    // ---- HELMET ----
    const hY = -30 + by;
    // helmet base
    ctx.fillStyle = '#1a3a5a';
    ctx.beginPath();
    ctx.arc(0, hY, 11, 0, Math.PI * 2);
    ctx.fill();
    // helmet top ridge / crest
    ctx.fillStyle = '#254f78';
    ctx.fillRect(-2, hY - 11, 6, 5);
    ctx.fillStyle = '#2a5a88';
    ctx.fillRect(-1, hY - 12, 4, 2);
    // helmet brim (front)
    ctx.fillStyle = '#0f2535';
    ctx.fillRect(-8, hY + 5, 17, 3);
    ctx.fillRect(-6, hY + 7, 13, 2);
    // visor plate
    ctx.fillStyle = '#040e1a';
    ctx.fillRect(-8, hY - 5, 16, 11);
    // visor inner shine / reflection
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#88ddff';
    ctx.fillRect(-7, hY - 4, 6, 9);
    ctx.globalAlpha = 1;
    // visor tint line
    ctx.fillStyle = '#0a1f30';
    ctx.fillRect(-8, hY - 5, 16, 2);
    // glowing eyes
    ctx.fillStyle = '#33eebb';
    ctx.fillRect(-6, hY - 2, 5, 5);              // left eye area
    ctx.fillRect( 1, hY - 2, 5, 5);              // right eye area
    const eyeGlow = 0.65 + Math.sin(gameTime * 3.8) * 0.35;
    ctx.globalAlpha = eyeGlow;
    ctx.fillStyle = '#00ffcc';
    ctx.fillRect(-5, hY - 1, 3, 3);              // left pupil
    ctx.fillRect( 2, hY - 1, 3, 3);              // right pupil
    ctx.globalAlpha = 1;
    // ear pieces / comms
    ctx.fillStyle = '#152d45';
    ctx.fillRect(-15, hY - 3, 6, 8);             // left ear
    ctx.fillRect(  9, hY - 3, 6, 8);             // right ear
    ctx.fillStyle = '#1e4060';
    ctx.fillRect(-14, hY - 2, 4, 5);
    ctx.fillRect( 10, hY - 2, 4, 5);
    // comms antenna
    ctx.fillStyle = P.ENEMY_RANGED;
    ctx.fillRect(-13, hY - 10, 2, 8);
    ctx.fillRect(-16, hY - 10, 6, 2);
    ctx.fillStyle = '#88ff99';
    ctx.fillRect(-17, hY - 10, 2, 2);            // antenna tip blink
    // helmet strap
    ctx.fillStyle = '#0d2030';
    ctx.fillRect(-8, hY + 7, 16, 2);

    // ---- MUZZLE FLASH ----
    if (muzzleFlash.life > 0) {
      const a   = muzzleFlash.life / muzzleFlash.maxLife;
      const fx  = 9 + gunLen + 8;
      const fy  = 7 + by;
      // outer bloom
      ctx.globalAlpha = a * 0.45;
      ctx.fillStyle = 'rgba(255,224,80,1)';
      ctx.beginPath();
      ctx.arc(fx, fy, 14, 0, Math.PI * 2);
      ctx.fill();
      // cross arms
      ctx.globalAlpha = a;
      ctx.fillStyle = P.MUZZLE;
      ctx.fillRect(fx - 1,  fy - 12, 3, 24);    // vertical
      ctx.fillRect(fx - 12, fy - 1,  24, 3);    // horizontal
      ctx.fillRect(fx - 8,  fy - 8,  16, 16);   // diagonal fill (square approx)
      // hot white core
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(fx - 3, fy - 3, 6, 6);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // ---- INVINCIBILITY SHIELD ----
    if (this.invTimer > 0 && Math.floor(this.invTimer * 22) % 2 === 0) {
      ctx.save();
      ctx.globalAlpha = 0.38;
      ctx.fillStyle = '#66ccff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// ============================================================
// 9. LEVEL DEFINITIONS
// ============================================================
const LEVELS = [
  { waves: [
    { TANK:3, FAST:0, RANGED:0, interval:2.2 },
    { TANK:4, FAST:2, RANGED:0, interval:1.9 },
  ]},
  { waves: [
    { TANK:3, FAST:4, RANGED:1, interval:1.6 },
    { TANK:5, FAST:3, RANGED:2, interval:1.4 },
  ]},
  { waves: [
    { TANK:4, FAST:5, RANGED:3, interval:1.2 },
    { TANK:6, FAST:4, RANGED:3, interval:1.1 },
  ]},
  { waves: [
    { TANK:5, FAST:7, RANGED:4, interval:1.0 },
    { TANK:7, FAST:6, RANGED:5, interval:0.9 },
  ]},
  { waves: [
    { TANK:6, FAST:8, RANGED:6, interval:0.8 },
    { TANK:10, FAST:10, RANGED:8, interval:0.7 },
  ]},
];

function buildSpawnQueue(cfg) {
  const q = [];
  for (let i = 0; i < cfg.TANK;   i++) q.push('TANK');
  for (let i = 0; i < cfg.FAST;   i++) q.push('FAST');
  for (let i = 0; i < cfg.RANGED; i++) q.push('RANGED');
  return shuffle(q);
}

// ============================================================
// 10. GAME STATE MANAGEMENT
// ============================================================
function initGame() {
  player       = new Player();
  enemies      = [];
  playerBullets = [];
  enemyBullets  = [];
  particles    = [];
  shake        = { x:0, y:0, timer:0, mag:0 };
  muzzleFlash  = { x:0, y:0, life:0, maxLife:0.08 };
  waveCleared  = false;
  startWave();
}

function resetFull() {
  score        = 0;
  currentLevel = 0;
  currentWave  = 0;
}

function startWave() {
  const cfg  = LEVELS[currentLevel].waves[currentWave];
  spawnQueue = buildSpawnQueue(cfg);
  spawnTimer = cfg.interval;
  tookDamageThisWave = false;
  waveBannerTimer = 2.5;
  waveActive = true;
}

function setState(s) {
  gameState = s;
  if (s === 'PLAYING') {
    initGame();
  }
  if (s === 'LEVEL_COMPLETE') {
    levelCompleteTimer = 3.5;
  }
}

// ============================================================
// 11. UPDATE FUNCTIONS
// ============================================================
function updatePlaying(dt) {
  gameTime += dt;
  muzzleFlash.life = Math.max(0, muzzleFlash.life - dt);

  // screen shake
  if (shake.timer > 0) {
    shake.timer -= dt;
    shake.x = (Math.random()-0.5) * 2 * shake.mag * (shake.timer / 0.18);
    shake.y = (Math.random()-0.5) * 2 * shake.mag * (shake.timer / 0.18);
  } else { shake.x = 0; shake.y = 0; }

  // wave banner
  waveBannerTimer = Math.max(0, waveBannerTimer - dt);

  // player
  player.update(dt);
  if (!player.alive) { setState('GAME_OVER'); return; }

  // spawn
  if (spawnQueue.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      enemies.push(makeEnemy(spawnQueue.pop()));
      spawnTimer = LEVELS[currentLevel].waves[currentWave].interval;
    }
  }

  // enemies
  enemies.forEach(e => e.update(dt, player));

  // bullets
  playerBullets.forEach(b => b.update(dt));
  enemyBullets.forEach(b => b.update(dt));

  // particles
  particles.forEach(p => p.update(dt));

  // collisions: player bullets vs enemies
  for (const b of playerBullets) {
    if (!b.alive) continue;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (overlap(b, e)) {
        e.takeDamage(b.damage);
        spawnHitSparks(b.x, b.y);
        b.alive = false;
        break;
      }
    }
  }

  // collisions: enemy bullets vs player
  for (const b of enemyBullets) {
    if (!b.alive) continue;
    if (overlap(b, player)) {
      player.takeDamage(b.damage);
      spawnHitSparks(b.x, b.y);
      b.alive = false;
    }
  }

  // collisions: enemies melee vs player
  for (const e of enemies) {
    if (overlap(e, player)) {
      player.takeDamage(e.damage * dt);
    }
  }

  // soft push between enemies (only when manageable count)
  if (enemies.length < 28) {
    for (let i = 0; i < enemies.length; i++) {
      for (let j = i+1; j < enemies.length; j++) {
        const a = enemies[i], b = enemies[j];
        const minD = a.radius + b.radius + 2;
        const dd = dist(a, b);
        if (dd < minD && dd > 0) {
          const push = (minD - dd) / 2;
          const dx = (a.x - b.x) / dd, dy = (a.y - b.y) / dd;
          a.x += dx * push; a.y += dy * push;
          b.x -= dx * push; b.y -= dy * push;
        }
      }
    }
  }

  // cull dead
  enemies       = enemies.filter(e => e.alive);
  playerBullets = playerBullets.filter(b => b.alive);
  enemyBullets  = enemyBullets.filter(b => b.alive);
  particles     = particles.filter(p => !p.dead);

  // wave complete check
  if (waveActive && spawnQueue.length === 0 && enemies.length === 0) {
    waveActive = false;
    if (!tookDamageThisWave) score += 200;

    const totalWaves = LEVELS[currentLevel].waves.length;
    if (currentWave + 1 < totalWaves) {
      // next wave in this level
      currentWave++;
      startWave();
    } else {
      // level complete
      score += 500;
      if (currentLevel + 1 >= LEVELS.length) {
        gameState = 'GAME_OVER'; // won all levels
      } else {
        currentLevel++;
        currentWave = 0;
        setState('LEVEL_COMPLETE');
      }
    }
  }
}

function updateLevelComplete(dt) {
  levelCompleteTimer -= dt;
  if (levelCompleteTimer <= 0 || mouse.clicked) {
    setState('PLAYING');
  }
}

// ============================================================
// 12. DRAW FUNCTIONS
// ============================================================
function drawBackground() {
  ctx.fillStyle = P.BG;
  ctx.fillRect(0, 0, CW, CH);
  ctx.strokeStyle = P.GRID;
  ctx.lineWidth = 0.5;
  for (let x = 0; x < CW; x += TILE) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
  }
  for (let y = 0; y < CH; y += TILE) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  }
}

function drawCrosshair() {
  const x = mouse.x, y = mouse.y, s = 10, g = 5;
  ctx.strokeStyle = P.UI_TEXT;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x-s-g, y); ctx.lineTo(x-g, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+g, y);   ctx.lineTo(x+s+g, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y-s-g); ctx.lineTo(x, y-g); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y+g);   ctx.lineTo(x, y+s+g); ctx.stroke();
  ctx.fillStyle = P.UI_TITLE;
  ctx.fillRect(x-1.5, y-1.5, 3, 3);
}

function drawHUD() {
  // HP bar
  const hpW = 200, hpH = 16;
  const hpX = 10, hpY = CH - 36;
  drawText('HP', hpX, hpY - 16, 11, P.UI_DIM);
  ctx.fillStyle = P.HP_BG;
  ctx.fillRect(hpX, hpY, hpW, hpH);
  const frac = player.hp / player.maxHp;
  const hpCol = frac > 0.6 ? P.HP_HIGH : frac > 0.3 ? P.HP_MED : P.HP_LOW;
  ctx.fillStyle = hpCol;
  ctx.fillRect(hpX, hpY, hpW * frac, hpH);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.strokeRect(hpX, hpY, hpW, hpH);
  drawText(Math.ceil(player.hp), hpX + hpW + 6, hpY, 13, P.UI_TEXT);

  // Score
  drawText('SCORE', 10, 10, 11, P.UI_DIM);
  drawText(String(score).padStart(6, '0'), 10, 24, 20, P.UI_TITLE, 'left', true);

  // Level / Wave
  const totalWaves = LEVELS[currentLevel].waves.length;
  drawText(`LVL ${currentLevel + 1}`, CW/2, 10, 13, P.UI_TEXT, 'center');
  drawText(`WAVE ${currentWave + 1}/${totalWaves}`, CW/2, 26, 11, P.UI_DIM, 'center');

  // Enemy count
  const remaining = enemies.length + spawnQueue.length;
  drawText('ENEMIES', CW - 10, 10, 11, P.UI_DIM, 'right');
  drawText(String(remaining), CW - 10, 24, 20, P.UI_TITLE, 'right', true);

  // Wave cleared bonus notice
  if (waveBannerTimer > 0) {
    const alpha = Math.min(1, waveBannerTimer);
    ctx.save();
    ctx.globalAlpha = alpha;
    const waveNum = currentWave + 1;
    // only show "wave X" banner on the wave that just started
    drawText(`WAVE ${waveNum}`, CW/2, CH/2 - 20, 48, P.UI_TITLE, 'center', true);
    ctx.restore();
  }
}

function drawPlaying() {
  ctx.save();
  ctx.translate(shake.x, shake.y);
  drawBackground();
  particles.forEach(p => p.draw());
  enemies.forEach(e => e.draw());
  enemyBullets.forEach(b => b.draw());
  playerBullets.forEach(b => b.draw());
  player.draw();
  ctx.restore();
  drawHUD();
  drawCrosshair();
}

function drawMenu() {
  drawBackground();

  // animated corner accents
  const pulse = (Math.sin(gameTime * 2.5) + 1) / 2;
  ctx.globalAlpha = 0.4 + pulse * 0.6;
  ctx.fillStyle = P.PLAYER_BODY;
  const sq = 8;
  ctx.fillRect(10, 10, sq, sq);
  ctx.fillRect(CW-10-sq, 10, sq, sq);
  ctx.fillRect(10, CH-10-sq, sq, sq);
  ctx.fillRect(CW-10-sq, CH-10-sq, sq, sq);
  ctx.globalAlpha = 1;

  // title
  drawText('RETRO', CW/2, 120, 62, P.UI_TITLE, 'center', true);
  drawText('SHOOTER', CW/2, 182, 62, P.UI_TITLE, 'center', true);

  // scanline effect on title area
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#000';
  for (let y = 115; y < 248; y += 6) ctx.fillRect(CW/2 - 250, y, 500, 3);
  ctx.globalAlpha = 1;

  drawText('SURVIVAL SHOOTER', CW/2, 255, 14, P.UI_DIM, 'center');

  // instructions
  const instX = CW/2 - 160;
  drawText('WASD / ARROW KEYS', instX, 310, 13, P.UI_TEXT);
  drawText('Move', instX + 190, 310, 13, P.UI_DIM);
  drawText('MOUSE', instX, 330, 13, P.UI_TEXT);
  drawText('Aim', instX + 190, 330, 13, P.UI_DIM);
  drawText('LEFT CLICK', instX, 350, 13, P.UI_TEXT);
  drawText('Shoot', instX + 190, 350, 13, P.UI_DIM);
  drawText('Clear all waves to advance!', CW/2, 378, 12, P.UI_DIM, 'center');

  // start button
  const bh = buttonHovered(CW/2, 440, 180, 48);
  drawButton('START GAME', CW/2, 440, 180, 48, bh);

  if (mouse.clicked && bh) {
    resetFull();
    setState('PLAYING');
  }
}

function drawLevelComplete() {
  drawBackground();
  ctx.fillStyle = P.OVERLAY;
  ctx.fillRect(0, 0, CW, CH);

  drawText('LEVEL COMPLETE!', CW/2, CH/2 - 100, 44, P.UI_TITLE, 'center', true);
  drawText(`Level ${currentLevel} Cleared`, CW/2, CH/2 - 44, 20, P.UI_TEXT, 'center');
  drawText(`Score: ${String(score).padStart(6,'0')}`, CW/2, CH/2 - 14, 18, P.UI_TEXT, 'center');

  const secs = Math.ceil(levelCompleteTimer);
  drawText(`Next level in ${secs}s...`, CW/2, CH/2 + 22, 14, P.UI_DIM, 'center');

  const bh = buttonHovered(CW/2, CH/2 + 75, 160, 44);
  drawButton('CONTINUE', CW/2, CH/2 + 75, 160, 44, bh);
  if (mouse.clicked && bh) setState('PLAYING');
}

function drawGameOver() {
  drawBackground();
  ctx.fillStyle = P.OVERLAY;
  ctx.fillRect(0, 0, CW, CH);

  const isWin = currentLevel >= LEVELS.length;
  const title = isWin ? 'YOU WIN!' : 'GAME OVER';

  drawText(title, CW/2, CH/2 - 110, 56, P.UI_TITLE, 'center', true);
  drawText(`Final Score: ${String(score).padStart(6,'0')}`, CW/2, CH/2 - 40, 22, P.UI_TEXT, 'center');
  drawText(`Level Reached: ${currentLevel + 1}`, CW/2, CH/2 - 10, 16, P.UI_DIM, 'center');

  const bh = buttonHovered(CW/2, CH/2 + 70, 160, 44);
  drawButton('PLAY AGAIN', CW/2, CH/2 + 70, 160, 44, bh);
  if (mouse.clicked && bh) {
    resetFull();
    gameState = 'MENU';
  }
}

// ============================================================
// 13. GAME LOOP
// ============================================================
let lastTime = 0;

function gameLoop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  gameTime += dt;

  ctx.clearRect(0, 0, CW, CH);

  switch (gameState) {
    case 'MENU':           drawMenu();           break;
    case 'PLAYING':        updatePlaying(dt); drawPlaying();        break;
    case 'LEVEL_COMPLETE': updateLevelComplete(dt); drawLevelComplete(); break;
    case 'GAME_OVER':      drawGameOver();       break;
  }

  mouse.clicked = false;
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(gameLoop); });
</script>
